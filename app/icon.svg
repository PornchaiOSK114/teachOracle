<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="อาจารย์ตี๋ที่สอน Oracle">
  <!-- กรอบสี่เหลี่ยมมุมมนสีขาว — ตรงกับ .brand-mark บนแถบเมนู (38px / radius 10px = 26%) -->
  <rect width="64" height="64" rx="17" ry="17" fill="#ffffff"/>
  <!-- ไอคอนฐานข้อมูล (ทรงกระบอก) สีแดงอิฐ Oracle — path ชุดเดียวกับ Navbar.tsx
       ต้นฉบับ viewBox 24x24 stroke-width 2 → ย่อ 1.6 เท่า วางกลางกรอบ 64x64 -->
  <g transform="translate(12.8 12.8) scale(1.6)"
     fill="none" stroke="#b23a2b" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5" rx="8" ry="3"/>
    <path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/>
    <path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/>
